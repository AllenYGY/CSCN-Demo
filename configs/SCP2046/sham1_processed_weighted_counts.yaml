run_name: scp2046_sham1_processed_weighted_counts

input:
  format: tables
  expr_path: ../../data/SCP2046/expression/processed_s1.csv.gz
  metadata_path: ../../data/SCP2046/cluster/spatial_s1.csv
  expr_orientation: genes_by_cells
  gene_key: GENE
  metadata_cell_id_column: NAME
  spatial_x_key: X
  spatial_y_key: Y

preprocess:
  normalize: false
  log1p: false
  sample_per_group: null
  random_seed: 42
  gene_selection:
    top_n: 150

run:
  output_dir: ../../runs
  max_workers: 120
  sigmoid_score: 0.1
  significance_level: 0.05
  max_cond_vars: 10
  use_bitmap: true
  using_nmf: false
  show_progress: false
  progress_interval: 100
  spatial:
    enabled: true
    strategy: weighted_counts
    mode: knn
    k: 391
    kernel: gaussian
    lambda_expr: 0.0
    min_effective_neighbors: 15

aggregate:
  consensus: true
  consensus_threshold_mode: auto

biomarker:
  enabled: false

viewer:
  enabled: false
